name: Build and publish ddns-go addon

on:
  push:
    branches: [main]
    paths:
      - 'ddns-go/**'
      - '.github/workflows/auto-update.yml'
  schedule:
    # 每天北京时间 14:00 (UTC 06:00) 检查一次
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get latest ddns-go version
        id: latest
        run: |
          LATEST=$(curl -fsSL \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/jeessy2/ddns-go/releases/latest \
            | jq -r '.tag_name' | sed 's/^v//')
          echo "version=${LATEST}" >> $GITHUB_OUTPUT
          echo "Latest version: ${LATEST}"

      - name: Get current version
        id: current
        run: |
          CURRENT=$(grep '^version:' ddns-go/config.yaml | awk -F'"' '{print $2}')
          echo "version=${CURRENT}" >> $GITHUB_OUTPUT
          echo "Current version: ${CURRENT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: ddns-go
          file: ddns-go/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ghcr.io/waidosia/ddns-go:latest
            ghcr.io/waidosia/ddns-go:${{ steps.latest.outputs.version }}
          build-args: |
            DDNS_GO_VERSION=${{ steps.latest.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update version in config files
        if: steps.latest.outputs.version != steps.current.outputs.version
        run: |
          VERSION="${{ steps.latest.outputs.version }}"
          sed -i "s/^version:.*/version: \"${VERSION}\"/" ddns-go/config.yaml
          sed -i "s/ARG DDNS_GO_VERSION=.*/ARG DDNS_GO_VERSION=\"${VERSION}\"/" ddns-go/Dockerfile
          echo "=== Updated config.yaml ==="
          head -5 ddns-go/config.yaml
          echo "=== Updated Dockerfile ==="
          grep "ARG DDNS_GO_VERSION" ddns-go/Dockerfile

      - name: Commit version bump
        if: steps.latest.outputs.version != steps.current.outputs.version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ddns-go/config.yaml ddns-go/Dockerfile
          git commit -m "chore: bump ddns-go to v${{ steps.latest.outputs.version }}"
          git push
