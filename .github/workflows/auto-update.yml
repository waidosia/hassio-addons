name: 自动更新 ddns-go 版本

on:
  schedule:
    # 每天北京时间 14:00 (UTC 06:00) 检查一次
    - cron: '0 6 * * *'
  # 支持手动触发
  workflow_dispatch:

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 获取 ddns-go 最新版本
        id: latest
        run: |
          LATEST=$(curl -fsSL \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/jeessy2/ddns-go/releases/latest \
            | jq -r '.tag_name' | sed 's/^v//')
          echo "version=${LATEST}" >> $GITHUB_OUTPUT
          echo "最新版本: ${LATEST}"

      - name: 获取当前版本
        id: current
        run: |
          CURRENT=$(grep '^version:' ddns-go/config.yaml | awk -F'"' '{print $2}')
          echo "version=${CURRENT}" >> $GITHUB_OUTPUT
          echo "当前版本: ${CURRENT}"

      - name: 检查是否需要更新
        id: check
        run: |
          if [ "${{ steps.latest.outputs.version }}" != "${{ steps.current.outputs.version }}" ]; then
            echo "need_update=true" >> $GITHUB_OUTPUT
            echo "需要更新: ${{ steps.current.outputs.version }} -> ${{ steps.latest.outputs.version }}"
          else
            echo "need_update=false" >> $GITHUB_OUTPUT
            echo "已是最新版本"
          fi

      - name: 更新版本号
        if: steps.check.outputs.need_update == 'true'
        run: |
          VERSION="${{ steps.latest.outputs.version }}"
          # 更新 config.yaml 中的 version 字段
          sed -i "s/^version:.*/version: \"${VERSION}\"/" ddns-go/config.yaml
          # 更新 Dockerfile 中的 DDNS_GO_VERSION
          sed -i "s/ARG DDNS_GO_VERSION=.*/ARG DDNS_GO_VERSION=\"${VERSION}\"/" ddns-go/Dockerfile
          echo "=== config.yaml ==="
          head -3 ddns-go/config.yaml
          echo "=== Dockerfile ==="
          grep "ARG DDNS_GO_VERSION" ddns-go/Dockerfile

      - name: 提交并推送
        if: steps.check.outputs.need_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ddns-go/config.yaml ddns-go/Dockerfile
          git commit -m "chore: bump ddns-go to v${{ steps.latest.outputs.version }}"
          git push
