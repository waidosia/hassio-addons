name: Build and publish ddns-go addon

on:
  push:
    branches: [main]
    paths:
      - 'ddns-go/**'
      - '.github/workflows/auto-update.yml'
  schedule:
    # 每天北京时间 14:00 (UTC 06:00) 检查一次
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            base_image: ghcr.io/home-assistant/amd64-base:3.21
          - arch: aarch64
            platform: linux/arm64
            base_image: ghcr.io/home-assistant/aarch64-base:3.21
          - arch: armv7
            platform: linux/arm/v7
            base_image: ghcr.io/home-assistant/armv7-base:3.21
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get latest ddns-go version
        id: latest
        run: |
          LATEST=$(curl -fsSL \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/jeessy2/ddns-go/releases/latest \
            | jq -r '.tag_name' | sed 's/^v//')
          echo "version=${LATEST}" >> $GITHUB_OUTPUT
          echo "Latest version: ${LATEST}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push single-arch image
        uses: docker/build-push-action@v6
        with:
          context: ddns-go
          file: ddns-go/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/waidosia/ddns-go:${{ matrix.arch }}-latest
          build-args: |
            DDNS_GO_VERSION=${{ steps.latest.outputs.version }}
            BUILD_FROM=${{ matrix.base_image }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

  manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get latest ddns-go version
        id: latest
        run: |
          LATEST=$(curl -fsSL \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/jeessy2/ddns-go/releases/latest \
            | jq -r '.tag_name' | sed 's/^v//')
          echo "version=${LATEST}" >> $GITHUB_OUTPUT
          echo "Latest version: ${LATEST}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest (latest)
        run: |
          docker buildx imagetools create -t ghcr.io/waidosia/ddns-go:latest \
            ghcr.io/waidosia/ddns-go:amd64-latest \
            ghcr.io/waidosia/ddns-go:aarch64-latest \
            ghcr.io/waidosia/ddns-go:armv7-latest

      - name: Create and push multi-arch manifest (version)
        run: |
          docker buildx imagetools create -t ghcr.io/waidosia/ddns-go:${{ steps.latest.outputs.version }} \
            ghcr.io/waidosia/ddns-go:amd64-latest \
            ghcr.io/waidosia/ddns-go:aarch64-latest \
            ghcr.io/waidosia/ddns-go:armv7-latest

      - name: Update version in config files
        run: |
          VERSION="${{ steps.latest.outputs.version }}"
          CURRENT=$(grep '^version:' ddns-go/config.yaml | awk -F'"' '{print $2}')
          if [ "$VERSION" != "$CURRENT" ]; then
            sed -i "s/^version:.*/version: \"${VERSION}\"/" ddns-go/config.yaml
            sed -i "s/ARG DDNS_GO_VERSION=.*/ARG DDNS_GO_VERSION=\"${VERSION}\"/" ddns-go/Dockerfile
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add ddns-go/config.yaml ddns-go/Dockerfile
            git commit -m "chore: bump ddns-go to v${VERSION} [skip ci]"
            git push
            echo "Bumped version to ${VERSION}"
          else
            echo "Version already up to date: ${VERSION}"
          fi
